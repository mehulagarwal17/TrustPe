[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc_version = "0.8.24"
optimizer = true
optimizer_runs = 200

# Default RPC & Chain configured for Monad Testnet
[rpc_endpoints]
monadTestnet = "https://testnet-rpc.monad.xyz"

[etherscan]
monadTestnet = { key = "not-needed", url = "https://testnet.monadvision.com/api" }
